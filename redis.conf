# ─── Redis 7 Configuration — Distributed Chat Platform ───────────────────────
#
# Tuned for pub/sub-heavy workload with moderate persistence requirements.
# Two primary uses:
#   1. Pub/Sub fan-out:  chat:room:* channels (ephemeral, high throughput)
#   2. Presence hash:    presence:users (low volume, TTL-based expiry)
#   3. Message cache:    cache:room:{id} sorted sets (read-heavy)
#   4. Rate limiting:    rate:user:{username} sorted sets (write-heavy, short TTL)

# ─── Network ──────────────────────────────────────────────────────────────────
bind 0.0.0.0
port 6379
protected-mode no
tcp-backlog 511
timeout 0
tcp-keepalive 300

# ─── General ──────────────────────────────────────────────────────────────────
daemonize no
loglevel notice
logfile ""
databases 1

# ─── Memory ───────────────────────────────────────────────────────────────────
# Cap at 512MB per Redis instance. When limit is reached, evict the least
# recently used keys that have a TTL (allkeys-lru would evict everything including
# presence and rate-limit data that must survive short bursts).
maxmemory 512mb
maxmemory-policy volatile-lru

# ─── Persistence ──────────────────────────────────────────────────────────────
# RDB snapshots provide a recovery baseline. AOF is disabled to prioritise
# throughput — pub/sub messages are ephemeral and message history is in Postgres.
# If you need stronger durability for cache data, enable appendonly yes.
save 900 1
save 300 10
save 60  10000

stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

appendonly no

# ─── Pub/Sub ──────────────────────────────────────────────────────────────────
# Clients subscribing to chat:room:* pattern receive messages on this channel.
# No specific pub/sub config needed — Redis pub/sub is enabled by default.
# The notify-keyspace-events setting enables keyspace notifications (unused here
# but useful for future TTL-expiry hooks, e.g. auto-offline presence cleanup).
notify-keyspace-events ""

# ─── Client limits ────────────────────────────────────────────────────────────
# Each chat server maintains a connection pool of up to 20 connections.
# Two chat servers = 40 pooled connections + headroom for monitoring tools.
maxclients 200

# Output buffer limits for pub/sub clients:
# If a subscriber is slow to consume messages, Redis will buffer up to
# 32MB before disconnecting. Prevents a slow subscriber from backpressuring
# the entire pub/sub system.
client-output-buffer-limit normal   0     0     0
client-output-buffer-limit pubsub   32mb  8mb   60
client-output-buffer-limit replica  256mb 64mb  60

# ─── Performance ──────────────────────────────────────────────────────────────
hz 20
dynamic-hz yes
aof-rewrite-incremental-fsync yes
rdb-save-incremental-fsync yes

# ─── Slow log ─────────────────────────────────────────────────────────────────
# Log commands taking longer than 10ms (useful for diagnosing Lua script perf)
slowlog-log-slower-than 10000
slowlog-max-len 128

# ─── Latency monitoring ───────────────────────────────────────────────────────
latency-monitor-threshold 100
