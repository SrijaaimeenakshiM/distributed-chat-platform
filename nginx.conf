worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" upstream=$upstream_addr';

    access_log /var/log/nginx/access.log main;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    gzip               on;
    gzip_types         text/plain application/json application/javascript text/css;

    # ── Upstream: two chat server instances ────────────────────────────────────
    #
    # ip_hash: routes each client IP consistently to the same upstream server.
    #
    # WHY ip_hash for WebSockets:
    # A WebSocket connection is a long-lived TCP session tied to one server process.
    # Without sticky routing, a client's HTTP upgrade request might land on server-1,
    # but subsequent HTTP requests (REST API calls, SockJS polling fallback) could
    # round-robin to server-2 — which has no record of that session.
    # ip_hash ensures all traffic from a given client IP hits the same backend,
    # keeping both HTTP and WebSocket sessions on the same server instance.
    #
    # LIMITATION: ip_hash breaks if many clients share a NAT IP (corporate proxies).
    # Production alternative: use cookie-based sticky sessions (nginx-plus) or a
    # consistent-hash on a session token extracted from the URL/cookie.
    upstream chat_servers {
        ip_hash;
        server chat-server-1:8080 max_fails=3 fail_timeout=30s;
        server chat-server-2:8080 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ── Server block ───────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Increase buffer sizes for WebSocket frames and large STOMP headers
        proxy_buffer_size          128k;
        proxy_buffers              4 256k;
        proxy_busy_buffers_size    256k;

        # ── Static React frontend ─────────────────────────────────────────────
        location / {
            root  /usr/share/nginx/html;
            index index.html;
            # SPA fallback: serve index.html for all unmatched paths
            try_files $uri $uri/ /index.html;
        }

        # ── REST API proxy ────────────────────────────────────────────────────
        location /api/ {
            proxy_pass         http://chat_servers;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Server-Id       $upstream_addr;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }

        # ── Health check endpoint (used by docker-compose healthcheck) ────────
        location /health {
            proxy_pass         http://chat_servers/health;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            access_log         off;
        }

        # ── WebSocket / SockJS endpoint ───────────────────────────────────────
        #
        # The WebSocket upgrade requires two specific headers:
        #   Connection: Upgrade  — tells the proxy to switch protocols
        #   Upgrade: websocket   — specifies which protocol to upgrade to
        #
        # proxy_read_timeout 3600s: WebSocket connections are idle for long periods
        # between messages. Without a long timeout nginx will close idle connections
        # after the default 60s, disconnecting all silent clients.
        #
        # proxy_send_timeout 3600s: prevents nginx from closing connections when
        # the upstream is slow to send (e.g., during a GC pause on the chat server).
        #
        # SockJS uses /ws/** paths for all its transport variants:
        #   /ws/websocket          — native WebSocket
        #   /ws/{server}/{session}/xhr_streaming — XHR streaming fallback
        #   /ws/{server}/{session}/jsonp         — JSONP long-poll fallback
        # The single location block covers all of them.
        location /ws/ {
            proxy_pass         http://chat_servers;
            proxy_http_version 1.1;

            # Required for WebSocket upgrade handshake
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "Upgrade";

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Long timeouts: WebSocket sessions are long-lived
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
            proxy_connect_timeout 10s;

            # Disable buffering for real-time message delivery
            proxy_buffering off;
        }

        # ── Actuator endpoints (internal monitoring only) ─────────────────────
        location /actuator/ {
            # In production, restrict to internal networks:
            # allow 10.0.0.0/8;
            # deny  all;
            proxy_pass         http://chat_servers;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
        }
    }
}
