version: "3.9"

# ─── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:

# ─── Shared network ────────────────────────────────────────────────────────────
networks:
  chat_net:
    driver: bridge

# ─── Reusable chat-server config via YAML anchor ──────────────────────────────
x-chat-server: &chat-server-base
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  networks:
    - chat_net
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  environment:
    # Database
    DB_HOST:     postgres
    DB_PORT:     5432
    DB_NAME:     chatdb
    DB_USER:     chatuser
    DB_PASS:     chatpass
    # Redis
    REDIS_HOST:  redis
    REDIS_PORT:  6379
    # JWT — override in production via secrets manager
    JWT_SECRET:  "Y2hhdC1wbGF0Zm9ybS1zZWNyZXQta2V5LW11c3QtYmUtMjU2LWJpdHMtbG9uZw=="
    # CORS
    ALLOWED_ORIGINS: "http://localhost,http://localhost:80,http://localhost:3000"
    # Spring profile
    SPRING_PROFILES_ACTIVE: docker

services:

  # ─── PostgreSQL 16 ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      - chat_net
    environment:
      POSTGRES_DB:       chatdb
      POSTGRES_USER:     chatuser
      POSTGRES_PASSWORD: chatpass
      PGDATA:            /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatuser -d chatdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─── Redis 7 ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - chat_net
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ─── Chat Server 1 ───────────────────────────────────────────────────────────
  chat-server-1:
    <<: *chat-server-base
    container_name: chat-server-1
    environment:
      SERVER_ID:   server-1
      SERVER_PORT: 8080
      DB_HOST:     postgres
      DB_PORT:     5432
      DB_NAME:     chatdb
      DB_USER:     chatuser
      DB_PASS:     chatpass
      REDIS_HOST:  redis
      REDIS_PORT:  6379
      JWT_SECRET:  "Y2hhdC1wbGF0Zm9ybS1zZWNyZXQta2V5LW11c3QtYmUtMjU2LWJpdHMtbG9uZw=="
      ALLOWED_ORIGINS: "http://localhost,http://localhost:80,http://localhost:3000"
      SPRING_PROFILES_ACTIVE: docker
    # Port not exposed to host — nginx is the only ingress point
    expose:
      - "8080"

  # ─── Chat Server 2 ───────────────────────────────────────────────────────────
  # Second instance demonstrates horizontal scaling.
  # Redis pub/sub ensures messages from clients on server-1
  # are delivered to clients on server-2 and vice versa.
  chat-server-2:
    <<: *chat-server-base
    container_name: chat-server-2
    environment:
      SERVER_ID:   server-2
      SERVER_PORT: 8080
      DB_HOST:     postgres
      DB_PORT:     5432
      DB_NAME:     chatdb
      DB_USER:     chatuser
      DB_PASS:     chatpass
      REDIS_HOST:  redis
      REDIS_PORT:  6379
      JWT_SECRET:  "Y2hhdC1wbGF0Zm9ybS1zZWNyZXQta2V5LW11c3QtYmUtMjU2LWJpdHMtbG9uZw=="
      ALLOWED_ORIGINS: "http://localhost,http://localhost:80,http://localhost:3000"
      SPRING_PROFILES_ACTIVE: docker
    expose:
      - "8080"

  # ─── Nginx (reverse proxy + WebSocket sticky sessions) ───────────────────────
  # ip_hash in nginx.conf ensures a given client always reaches the same
  # chat server, keeping its WebSocket session alive without shared session state.
  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    networks:
      - chat_net
    depends_on:
      - chat-server-1
      - chat-server-2
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 3
